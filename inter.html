<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fútbol Internacional & LATAM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Roboto Condensed', sans-serif; background: #1b1c1d; color: #f0f0f0; padding: 20px; }

    h1 { font-family: 'Teko', sans-serif; font-size: 2.5rem; text-transform: uppercase; margin-bottom: 20px; text-align: center; letter-spacing: 2px; }

    .layout { display: grid; grid-template-columns: 280px 1fr 1fr; gap: 20px; max-width: 1300px; margin: 0 auto; }

    /* Acordeón de Países */
    .league-accordion { display: flex; flex-direction: column; gap: 0.4rem; }
    .accordion-item { border: 1px solid #333; border-radius: 6px; overflow: hidden; background: #252628; }
    .accordion-header {
      width: 100%; display: flex; align-items: center; justify-content: space-between;
      padding: 0.6rem 0.8rem; background: #19622b; color: #fff; border: none;
      font-family: 'Teko', sans-serif; font-size: 1.25rem; letter-spacing: 1px; cursor: pointer;
    }
    .accordion-header:hover { background: #134d22; }
    .country-info { display: flex; align-items: center; gap: 0.6rem; }
    .flag-icon { width: 20px; height: 14px; object-fit: cover; border-radius: 2px; }
    .chevron { font-size: 0.8rem; transition: transform 0.2s; }
    .accordion-item.active .chevron { transform: rotate(180deg); }
    .accordion-content { display: none; padding: 0.5rem; flex-direction: column; gap: 0.4rem; background: #1d1e20; }
    .accordion-item.active .accordion-content { display: flex; }

    .comp-btn {
      background: #2c2d30; border: 1px solid #444; color: #ccc; padding: 8px;
      font-family: 'Roboto Condensed', sans-serif; font-size: 0.9rem; border-radius: 4px;
      cursor: pointer; text-align: left; transition: all 0.2s;
    }
    .comp-btn:hover, .comp-btn.active { background: #2ebd59; color: #111; font-weight: bold; border-color: #2ebd59; }

    /* Paneles de Datos */
    .panel { background: #252628; border: 1px solid #333; border-radius: 8px; padding: 15px; }
    .panel-title { font-family: 'Teko', sans-serif; font-size: 1.8rem; margin-bottom: 12px; border-bottom: 2px solid #2ebd59; }

    /* Partidos */
    .match-card { background: #1d1e20; border: 1px solid #333; border-radius: 6px; padding: 10px; margin-bottom: 10px; }
    .match-date { font-size: 0.75rem; color: #888; margin-bottom: 6px; display: block; }
    .match-row { display: flex; align-items: center; justify-content: space-between; font-size: 0.95rem; }
    .team-info { display: flex; align-items: center; gap: 8px; width: 40%; }
    .team-info.away { justify-content: flex-end; }
    .team-logo { width: 20px; height: 20px; object-fit: contain; }
    .score-box { font-family: 'Teko', sans-serif; font-size: 1.4rem; font-weight: bold; color: #2ebd59; min-width: 50px; text-align: center; }

    /* Tablas */
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    th { background: #1d1e20; color: #888; text-align: center; padding: 8px; font-weight: 700; border-bottom: 1px solid #333; }
    th.th-team { text-align: left; }
    td { padding: 8px; border-bottom: 1px solid #333; text-align: center; }
    td.td-team { text-align: left; display: flex; align-items: center; gap: 8px; }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <h1>Fútbol Internacional & LATAM (ESPN)</h1>

  <div class="layout">
    <!-- BARRA LATERAL / ACORDEÓN -->
    <aside class="league-accordion">
      <!-- INGLATERRA -->
      <div class="accordion-item active">
        <button class="accordion-header" type="button">
          <span class="country-info"><img src="https://flagcdn.com/w40/gb-eng.png" class="flag-icon" alt="" /> INGLATERRA</span>
          <span class="chevron">▼</span>
        </button>
        <div class="accordion-content">
          <button class="comp-btn active" data-league="eng.1">Premier League</button>
        </div>
      </div>

      <!-- ESPAÑA -->
      <div class="accordion-item">
        <button class="accordion-header" type="button">
          <span class="country-info"><img src="https://flagcdn.com/w40/es.png" class="flag-icon" alt="" /> ESPAÑA</span>
          <span class="chevron">▼</span>
        </button>
        <div class="accordion-content">
          <button class="comp-btn" data-league="esp.1">LaLiga</button>
        </div>
      </div>

      <!-- ITALIA -->
      <div class="accordion-item">
        <button class="accordion-header" type="button">
          <span class="country-info"><img src="https://flagcdn.com/w40/it.png" class="flag-icon" alt="" /> ITALIA</span>
          <span class="chevron">▼</span>
        </button>
        <div class="accordion-content">
          <button class="comp-btn" data-league="ita.1">Serie A</button>
        </div>
      </div>

      <!-- ALEMANIA -->
      <div class="accordion-item">
        <button class="accordion-header" type="button">
          <span class="country-info"><img src="https://flagcdn.com/w40/de.png" class="flag-icon" alt="" /> ALEMANIA</span>
          <span class="chevron">▼</span>
        </button>
        <div class="accordion-content">
          <button class="comp-btn" data-league="ger.1">Bundesliga</button>
        </div>
      </div>

      <!-- FRANCIA -->
      <div class="accordion-item">
        <button class="accordion-header" type="button">
          <span class="country-info"><img src="https://flagcdn.com/w40/fr.png" class="flag-icon" alt="" /> FRANCIA</span>
          <span class="chevron">▼</span>
        </button>
        <div class="accordion-content">
          <button class="comp-btn" data-league="fra.1">Ligue 1</button>
        </div>
      </div>

      <!-- BRASIL -->
      <div class="accordion-item">
        <button class="accordion-header" type="button">
          <span class="country-info"><img src="https://flagcdn.com/w40/br.png" class="flag-icon" alt="" /> BRASIL</span>
          <span class="chevron">▼</span>
        </button>
        <div class="accordion-content">
          <button class="comp-btn" data-league="bra.1">Brasileirão</button>
        </div>
      </div>

      <!-- URUGUAY -->
      <div class="accordion-item">
        <button class="accordion-header" type="button">
          <span class="country-info"><img src="https://flagcdn.com/w40/uy.png" class="flag-icon" alt="" /> URUGUAY</span>
          <span class="chevron">▼</span>
        </button>
        <div class="accordion-content">
          <button class="comp-btn" data-league="uru.1">Primera División</button>
        </div>
      </div>

      <!-- CHILE -->
      <div class="accordion-item">
        <button class="accordion-header" type="button">
          <span class="country-info"><img src="https://flagcdn.com/w40/cl.png" class="flag-icon" alt="" /> CHILE</span>
          <span class="chevron">▼</span>
        </button>
        <div class="accordion-content">
          <button class="comp-btn" data-league="chi.1">Primera División</button>
        </div>
      </div>

      <!-- ECUADOR -->
      <div class="accordion-item">
        <button class="accordion-header" type="button">
          <span class="country-info"><img src="https://flagcdn.com/w40/ec.png" class="flag-icon" alt="" /> ECUADOR</span>
          <span class="chevron">▼</span>
        </button>
        <div class="accordion-content">
          <button class="comp-btn" data-league="ecu.1">LigaPro</button>
        </div>
      </div>

      <!-- COLOMBIA -->
      <div class="accordion-item">
        <button class="accordion-header" type="button">
          <span class="country-info"><img src="https://flagcdn.com/w40/co.png" class="flag-icon" alt="" /> COLOMBIA</span>
          <span class="chevron">▼</span>
        </button>
        <div class="accordion-content">
          <button class="comp-btn" data-league="col.1">Liga BetPlay</button>
        </div>
      </div>

      <!-- CONTINENTAL -->
      <div class="accordion-item">
        <button class="accordion-header" type="button">
          <span class="country-info"><img src="https://flagcdn.com/w40/un.png" class="flag-icon" alt="" /> CONTINENTALES</span>
          <span class="chevron">▼</span>
        </button>
        <div class="accordion-content">
          <button class="comp-btn" data-league="uefa.champions">Champions League</button>
          <button class="comp-btn" data-league="conmebol.libertadores">Copa Libertadores</button>
          <button class="comp-btn" data-league="conmebol.sudamericana">Copa Sudamericana</button>
        </div>
      </div>
    </aside>

    <!-- RESULTADOS Y PRÓXIMOS -->
    <main class="panel">
      <h2 class="panel-title">Partidos</h2>
      <div id="matches-list">Cargando partidos...</div>
    </main>

    <!-- TABLA DE POSICIONES -->
    <section class="panel">
      <h2 class="panel-title">Tabla de Posiciones</h2>
      <div id="standings-wrap">Cargando tabla...</div>
    </section>
  </div>

  <script src="inter.js"></script>
</body>
</html>
