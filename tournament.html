<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Torneo | LA FECHA </title>

<style>
  /* ==========================================
     SISTEMA DE DISEÑO PROMIEDOS AR (UNIFICADO)
     ========================================== */
  :root {
    --paper: #69ac48;
    --paper-raised: #e2e2e2;
    --paper-dim: #e2dcc8;
    --ink: #22201e;
    --ink-soft: #0a0a0a;
    --ink-faint: #080808;
    --rule: #cfc6ab;
    --rule-strong: #b7ac8c;
    --red: #c31d1f;
    --red-dim: #8f1517;
    --pitch: #1f6b3a;
    --orange: #c1631f;
    --sky: #2f7fae;
    --gold: #b3841a;

    --font-display: "Teko", sans-serif;
    --font-body: "Roboto Condensed", sans-serif;
    --font-mono: "Space Mono", "Roboto Condensed", monospace;

    --radius: 3px;
    --shadow-card: 0 1px 0 var(--rule), 0 8px 18px -14px rgba(24, 20, 15, 0.35);
    --shadow-raised: 0 18px 40px -20px rgba(24, 20, 15, 0.45);
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    color: var(--ink);
    font-family: var(--font-body);
    background-color: var(--paper);
    background-image: radial-gradient(rgba(24, 20, 15, 0.07) 0.6px, transparent 0.6px);
    background-size: 10px 10px;
  }

  button,
  input {
    font: inherit;
  }

  button {
    cursor: pointer;
  }

  .page {
    max-width: 1400px;
    width: min(100% - 2rem, 1400px);
    margin: 0 auto;
    padding: 1.2rem 0 3rem;
  }

  /* ==========================================
     HEADER DEL TORNEO / COMPONENTES
     ========================================== */

  .tournament-header {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1.2rem;
    border-bottom: 3px solid var(--ink);
    padding-bottom: 0.8rem;
  }

  .back-button {
    border: 1.5px solid var(--ink);
    background: transparent;
    color: var(--ink);
    border-radius: var(--radius);
    padding: 0.45rem 0.85rem;
    font-family: var(--font-body);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-size: 0.82rem;
    transition: background 0.15s ease, color 0.15s ease, transform 0.15s ease;
  }

  .back-button:hover {
    background: var(--ink);
    color: var(--paper-raised);
    transform: translateY(-1px);
  }

  .header-info {
    flex: 1;
  }

  .eyebrow {
    margin: 0 0 2px;
    color: var(--red);
    font-family: var(--font-mono);
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.15em;
  }

  h1 {
    margin: 0;
    font-family: var(--font-display);
    font-size: clamp(2.2rem, 5vw, 3.5rem);
    line-height: 0.9;
    text-transform: uppercase;
    letter-spacing: 0.01em;
  }

  .subtitle {
    margin: 4px 0 0;
    color: var(--ink-soft);
    font-family: var(--font-mono);
    font-size: 0.8rem;
  }

  /* ==========================================
     BARRA DE ESTADO / LIVES
     ========================================== */

  .status-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.8rem;
    padding: 0.6rem 0.9rem;
    margin-bottom: 1.2rem;
    background: var(--ink);
    color: var(--paper-raised);
    border-radius: var(--radius);
    font-family: var(--font-mono);
    font-size: 0.78rem;
    letter-spacing: 0.03em;
  }

  .status-bar.live::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--red);
    display: inline-block;
    margin-right: 0.4rem;
    animation: dotPulse 1.4s ease-in-out infinite;
  }

  /* ==========================================
     CONTROLES Y BÚSQUEDA
     ========================================== */

  .controls {
    display: flex;
    gap: 0.75rem;
    margin-bottom: 1.2rem;
  }

  .search {
    width: 100%;
    padding: 0.55rem 0.85rem;
    border-radius: var(--radius);
    border: 1.5px solid var(--rule-strong);
    outline: none;
    background: var(--paper-raised);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 0.9rem;
    transition: border-color 0.15s ease, box-shadow 0.2s ease;
  }

  .search:focus {
    border-color: var(--ink);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--ink) 12%, transparent);
  }

  /* ==========================================
     LAYOUT DE 2 / 3 COLUMNAS
     ========================================== */

  .content-grid {
    display: grid;
    grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
    gap: 1.25rem;
    align-items: start;
  }

  .panel {
    background: color-mix(in srgb, var(--paper-raised) 82%, transparent);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    box-shadow: var(--shadow-card);
    overflow: hidden;
  }

  .panel-header {
    padding: 0.75rem 1rem;
    border-bottom: 2px solid var(--ink);
    background: var(--paper-dim);
  }

  .panel-header h2 {
    margin: 0;
    font-family: var(--font-display);
    font-size: 1.6rem;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    line-height: 1;
  }

  .panel-header p {
    margin: 3px 0 0;
    color: var(--ink-soft);
    font-family: var(--font-mono);
    font-size: 0.72rem;
    text-transform: uppercase;
  }

  /* ==========================================
     TABLA DE POSICIONES
     ========================================== */

  .table-wrap {
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-family: var(--font-mono);
  }

  th,
  td {
    padding: 0.4rem 0.55rem;
    text-align: center;
    border-bottom: 1px solid var(--rule);
    white-space: nowrap;
    font-size: 0.82rem;
  }

  th {
    color: var(--ink-faint);
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    font-weight: 700;
    background: color-mix(in srgb, var(--paper-dim) 50%, transparent);
  }

  tbody tr {
    transition: background 0.15s ease;
  }

  tbody tr:hover {
    background: var(--paper-dim);
  }

  tbody tr:last-child td {
    border-bottom: 0;
  }

  .position {
    width: 32px;
    color: var(--ink-faint);
    font-weight: 700;
  }

  .team {
    display: flex;
    align-items: center;
    gap: 0.45rem;
    text-align: left;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 0.92rem;
    min-width: 150px;
  }

  .team-logo {
    width: 20px;
    height: 20px;
    object-fit: cover;
    border-radius: 50%;
    border: 1px solid var(--rule-strong);
    background: var(--paper-raised);
    flex-shrink: 0;
  }

  .pts {
    font-weight: 700;
    color: var(--ink);
  }

  /* ==========================================
     PARTIDOS Y FECHAS
     ========================================== */

  .matches {
    padding: 0;
    display: flex;
    flex-direction: column;
  }

  .day-divider {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 0.5rem 0.85rem;
    background: var(--paper-dim);
    border-bottom: 2px solid var(--ink);
    color: var(--ink);
    font-family: var(--font-display);
    font-size: 1.25rem;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }

  .match {
    padding: 0.75rem 0.9rem;
    border-bottom: 1px solid var(--rule);
    transition: background 0.15s ease, transform 0.15s ease;
    background: var(--paper-raised);
    position: relative;
  }

  .match:last-child {
    border-bottom: 0;
  }

  .match:hover {
    background: var(--paper-dim);
  }

  .match.live {
    background: rgba(195, 29, 31, 0.06);
    border-left: 4px solid var(--red);
  }

  .match-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 0.4rem;
    font-family: var(--font-mono);
  }

  .match-status {
    font-size: 0.68rem;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .match-status.live {
    color: var(--red);
    font-weight: 700;
  }

  .match-time {
    font-size: 0.75rem;
    color: var(--ink-faint);
  }

  .teams {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 0.75rem;
  }

  .match-team {
    display: flex;
    align-items: center;
    gap: 0.45rem;
    min-width: 0;
    font-weight: 700;
    font-size: 0.95rem;
  }

  .match-team.away {
    justify-content: flex-end;
    text-align: right;
  }

  .match-team span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .score {
    min-width: 50px;
    text-align: center;
    font-family: var(--font-display);
    font-size: 1.6rem;
    font-weight: 700;
    line-height: 1;
    color: var(--ink);
    letter-spacing: 0.05em;
    background: var(--paper-dim);
    padding: 0.1rem 0.4rem;
    border-radius: var(--radius);
    border: 1px solid var(--rule);
  }

  .summary-link {
    display: inline-block;
    margin-top: 0.4rem;
    color: var(--ink-soft);
    font-family: var(--font-mono);
    font-size: 0.72rem;
    text-decoration: none;
    text-transform: uppercase;
    border-bottom: 1px dotted var(--rule-strong);
  }

  .summary-link:hover {
    color: var(--ink);
    border-bottom-style: solid;
  }

  /* ==========================================
     ESTADOS VACÍOS Y ANIMACIONES
     ========================================== */

  .empty,
  .loading,
  .error {
    padding: 2rem 1rem;
    text-align: center;
    font-family: var(--font-mono);
    font-size: 0.85rem;
    color: var(--ink-soft);
  }

  .error {
    color: var(--red);
    font-weight: 700;
  }

  @keyframes dotPulse {
    0% { box-shadow: 0 0 0 0 rgba(195, 29, 31, 0.5); }
    70% { box-shadow: 0 0 0 6px rgba(195, 29, 31, 0); }
    100% { box-shadow: 0 0 0 0 rgba(195, 29, 31, 0); }
  }

  /* ==========================================
     RESPONSIVE
     ========================================== */

  @media (max-width: 900px) {
    .content-grid {
      grid-template-columns: 1fr;
    }
  }

  @media (max-width: 600px) {
    .page {
      padding-top: 0.8rem;
    }

    .tournament-header {
      align-items: flex-start;
    }

    .teams {
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      gap: 0.4rem;
    }

    .score {
      font-size: 1.3rem;
      min-width: 42px;
    }

    th,
    td {
      padding: 0.3rem 0.35rem;
    }
  }
</style>
</head>

<body>

  <main class="page">

    <header class="tournament-header">

      <button
        id="back-button"
        class="back-button"
        type="button"
      >
        ← Volver
      </button>

      <div class="header-info">
        <p id="competition-label" class="eyebrow">
          Competencia
        </p>

        <h1 id="tournament-title">
          Cargando torneo...
        </h1>

        <p id="tournament-subtitle" class="subtitle">
          Temporada
        </p>
      </div>

    </header>


    <div id="status-bar" class="status-bar">
      <span id="status-text">
        Cargando datos...
      </span>

      <span id="last-update"></span>
    </div>


    <div class="controls">

      <input
        id="team-search"
        class="search"
        type="search"
        placeholder="Buscar equipo..."
        autocomplete="off"
      >

    </div>


    <div class="content-grid">

      <!-- ======================================
           TABLA
      ======================================= -->

      <section class="panel">

        <div class="panel-header">
          <h2>Tabla de posiciones</h2>

          <p id="standings-description">
            Posiciones del torneo
          </p>
        </div>

        <div class="table-wrap">

          <table>

            <thead>
              <tr>
                <th>#</th>
                <th>Equipo</th>
                <th>PTS</th>
                <th>PJ</th>
                <th>DG</th>
              </tr>
            </thead>

            <tbody id="standings-body">
              <tr>
                <td colspan="5" class="loading">
                  Cargando tabla...
                </td>
              </tr>
            </tbody>

          </table>

        </div>

      </section>


      <!-- ======================================
           PARTIDOS
      ======================================= -->

      <section class="panel">

        <div class="panel-header">

          <h2>Partidos</h2>

          <p id="matches-description">
            Resultados y próximos partidos
          </p>

        </div>

        <div id="matches-container" class="matches">

          <div class="loading">
            Cargando partidos...
          </div>

        </div>

      </section>

    </div>

  </main>

  <script type="module" src="js/tournament.js"></script>

</body>
</html>
